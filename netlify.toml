# Tells Netlify where the site's files live and where its serverless functions live.
# Needed for the dining-hall lookup (netlify/functions/dining-menu.js) — without this, Netlify has
# no way to know the netlify/functions folder should be deployed as a function rather than ignored.
#
# The function has no dependencies (it is a plain fetch pass-through to University Housing's
# menu feed), so the site is Git-connected and every push builds and publishes it on its own.
# Drag-and-drop deploys do NOT ship functions — that is how the first version went two weeks
# without ever running (Calorie App notes.md, 2026-09-06).
[build]
  publish = "."
  functions = "netlify/functions"
